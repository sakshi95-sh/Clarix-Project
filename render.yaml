services:
  - type: web
    name: clarix
    env: node
    plan: free

    buildCommand: |
      npm install
      npx prisma generate
      npx prisma migrate deploy
      npm run build

    startCommand: npm start

    envVars:
      - key: DATABASE_URL
        sync: false

      - key: JWT_SECRET
        sync: false

      - key: OPENROUTER_API_KEY
        sync: false

      - key: AWS_ACCESS_KEY_ID
        sync: false

      - key: AWS_SECRET_ACCESS_KEY
        sync: false

      - key: AWS_REGION
        sync: false

      - key: AWS_BUCKET_NAME
        sync: false
